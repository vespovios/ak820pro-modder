[package]
name = "ak820pro-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tauri shell for the AK820 Pro control app"

[lib]
name = "ak820pro_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
ak820-protocol = { path = "../crates/ak820-protocol" }
tauri = { version = "2.1", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# `rt-multi-thread` so the audio-reactive streamer can spawn its loop
# without starving the rest of the runtime. `time` for the frame
# pacing inside that loop. `macros` so we can keep using #[tauri::command]
# attrs that depend on tokio's spawn.
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "macros"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSUserDefaults", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSRunningApplication"] }
core-foundation = "0.10"
core-graphics = "0.25"
# Audio-reactive lighting (Phase 6 part 1b). `capture` pulls in
# ScreenCaptureKit + the Swift static lib; the Swift runtime rpath is
# baked in by `build.rs` below.
ak820-audio-reactive = { path = "../crates/ak820-audio-reactive", features = ["capture"] }
